<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MegaPromoMix Achadinhos</title><meta name="description" content="Os achadinhos dos vídeos da @megapromomix, com link. Procure pelo número do vídeo.">
<meta name="theme-color" content="#ff8a4c"><link rel="icon" href="img/perfil.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#1b4fa8;--lar:#ff8a4c;--ama:#ffd600;--bg:#f6f4f2;--txt:#1f1f1f;--sub:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.topo{background:linear-gradient(135deg,var(--lar),#ff6a3d);padding:28px 16px 64px;text-align:center;color:#fff;border-radius:0 0 28px 28px}
.topo img{width:88px;height:88px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.topo h1{margin:10px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.3px}.topo p{margin:0;font-size:14px;opacity:.95}
.busca{position:sticky;top:0;z-index:5;padding:0 16px;margin-top:-30px}
.busca div{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 24px rgba(27,79,168,.14)}
.busca svg{flex:0 0 22px}.busca input{flex:1;border:0;outline:0;font:500 16px Poppins,system-ui,sans-serif;background:transparent}
main{max-width:680px;margin:18px auto 0;padding:0 14px 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ft{position:relative;aspect-ratio:1/1;background:#eee}.ft img{width:100%;height:100%;object-fit:cover;display:block}
.n{position:absolute;top:8px;left:8px;background:var(--azul);color:#fff;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px}
h2{font-size:13.5px;font-weight:600;line-height:1.3;margin:10px 12px 8px;flex:1}
.bs{display:flex;flex-direction:column;gap:6px;padding:0 10px 12px}
.b{text-align:center;text-decoration:none;font-weight:600;font-size:13px;padding:10px;border-radius:12px}
.shp{background:var(--lar);color:#fff}.ml{background:var(--ama);color:#1b1b1b}
.vazio,.nada{grid-column:1/-1;text-align:center;color:var(--sub)}
footer{text-align:center;font-size:10.5px;color:#a3a3a3;padding:8px 16px 28px}
@media(min-width:620px){main{grid-template-columns:1fr 1fr 1fr}}
</style></head><body>
<header class="topo"><img src="img/perfil.jpg" alt="MegaPromoMix"><h1>MegaPromoMix</h1><p>Viu no vídeo? Ache pelo número ou pelo nome</p></header>
<div class="busca"><div><svg viewBox="0 0 24 24" fill="none" stroke="#1b4fa8" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" type="search" placeholder="Ex.: 12 ou varal" autocomplete="off" inputmode="search"></div></div>
<main id="lista">
<article class="c" data-n="1" data-q="1 varal retrátil de parede 30 metros"><div class="ft"><img src="img/1.jpg" alt="Varal retrátil de parede 30 metros" loading="lazy"><span class="n">#1</span></div><h2>Varal retrátil de parede 30 metros</h2><div class="bs"><a class="b shp" href="https://s.shopee.com.br/8fUBiGsZi8" target="_blank" rel="noopener sponsored">Shopee</a><a class="b ml" href="https://meli.la/1XQXKcR" target="_blank" rel="noopener sponsored">Mercado Livre</a></div></article>
<p class="nada" id="nada" hidden>Nada por aqui. Tente outro nome ou o número do vídeo.</p>
</main>
<footer>Links de afiliado.</footer>
<script>
const q=document.getElementById('q'),cs=[...document.querySelectorAll('.c')],nada=document.getElementById('nada');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function f(){const v=norm(q.value).replace(/^#/,'');let n=0;cs.forEach(c=>{const ok=!v||(/^\d+$/.test(v)?c.dataset.n===v:norm(c.dataset.q).includes(v));
c.hidden=!ok;n+=ok});nada.hidden=n>0}
q.addEventListener('input',f);const h=new URLSearchParams(location.search).get('q');if(h){q.value=h;f()}
</script></body></html>
